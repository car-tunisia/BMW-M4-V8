    <source src="Record_2025-05-06-15-36-57.mp3" type="audio/mp3">
  </audio>

  <script>
    let currentAudio = null;

    function playSound(id) {
      const audio = document.getElementById(id);
      if (currentAudio && !currentAudio.paused) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = audio;
      audio.currentTime = 0;
      audio.play();
    }
